<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up - FeastFleet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Standard Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="navbar-brand">
        <div class="brand-icon">🔥</div>
        Feast<span class="accent">Fleet</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html"><i class="bi bi-house"></i> Home</a></li>
        <li><a href="restaurants.html"><i class="bi bi-shop"></i> Restaurants</a></li>
        <li><a href="cart.html" class="cart-link"><i class="bi bi-bag"></i> Cart <span class="cart-badge">0</span></a></li>
        <li><a href="contact.html"><i class="bi bi-envelope"></i> Contact</a></li>
      </ul>
      <div class="nav-auth">
        <a href="login.html" class="btn-nav-login">Sign In</a>
      </div>
      <button class="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Auth Page -->
  <div class="auth-page reveal">
    <div class="auth-card">
      <div class="auth-header">
        <h1 id="auth-title">Welcome Back</h1>
        <p id="auth-subtitle">Sign in to your FeastFleet account</p>
      </div>

      <div class="auth-toggle">
        <button type="button" id="btn-login-tab" class="active">Sign In</button>
        <button type="button" id="btn-signup-tab">Sign Up</button>
      </div>

      <form id="auth-form">
        <div id="signup-fields" style="display: none;">
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="form-control-custom" placeholder="John Doe">
          </div>
          <div class="form-group">
            <label for="phoneNumber">Phone Number</label>
            <input type="tel" id="phoneNumber" class="form-control-custom" placeholder="+1 (555) 000-0000">
          </div>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control-custom" placeholder="name@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control-custom" placeholder="••••••••" required>
        </div>
        
        <button type="submit" id="auth-submit" class="btn-auth">Sign In</button>
      </form>

      <div class="social-divider">or continue with</div>

      <div class="social-buttons">
        <button type="button" class="btn-social">
          <i class="bi bi-google"></i> Google
        </button>
        <button type="button" class="btn-social">
          <i class="bi bi-apple"></i> Apple
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
