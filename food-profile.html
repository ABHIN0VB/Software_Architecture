<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Food Profile — FeastFleet AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #0a0a12; color: #f0f0f5; font-family: 'Inter', sans-serif; min-height: 100vh; margin: 0; }

    .hero {
      padding: 52px 20px 28px; text-align: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(139,92,246,0.12) 0%, transparent 70%);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .hero .badge { display: inline-block; background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.35); color: #a78bfa; font-size: 0.72rem; font-weight: 700; padding: 4px 14px; border-radius: 20px; letter-spacing: 0.08em; margin-bottom: 14px; }
    .hero h1 { font-size: 2.1rem; font-weight: 900; margin: 0 0 10px; background: linear-gradient(135deg, #a78bfa, #FF6B35); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: rgba(255,255,255,0.5); font-size: 0.95rem; margin: 0; }

    .main { max-width: 960px; margin: 0 auto; padding: 36px 20px 80px; }

    /* TOP STATS GRID */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .stat-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; padding: 18px; text-align: center;
    }
    .stat-card.highlight { border-color: rgba(167,139,250,0.3); background: rgba(139,92,246,0.06); }
    .stat-icon { font-size: 1.6rem; margin-bottom: 8px; }
    .stat-val { font-size: 1.5rem; font-weight: 900; color: #a78bfa; }
    .stat-label { font-size: 0.72rem; font-weight: 600; color: rgba(255,255,255,0.35); margin-top: 4px; letter-spacing: 0.03em; }

    /* SECTIONS */
    .section { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 22px; margin-bottom: 18px; }
    .section-title { font-size: 0.75rem; font-weight: 800; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 18px; }

    /* FAVOURITE DISHES */
    .dish-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .dish-row:last-child { border-bottom: none; }
    .dish-rank { font-size: 1rem; width: 28px; }
    .dish-name { flex: 1; font-size: 0.88rem; font-weight: 600; padding: 0 12px; }
    .dish-count { background: rgba(167,139,250,0.15); color: #a78bfa; border-radius: 20px; padding: 2px 12px; font-size: 0.72rem; font-weight: 700; }

    /* BAR CHART */
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: flex; align-items: center; gap: 12px; }
    .bar-label { font-size: 0.78rem; color: rgba(255,255,255,0.55); width: 90px; flex-shrink: 0; text-align: right; }
    .bar-track { flex: 1; height: 10px; background: rgba(255,255,255,0.06); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, #a78bfa, #FF6B35); transition: width 0.8s ease; }
    .bar-val { font-size: 0.72rem; color: rgba(255,255,255,0.4); width: 50px; text-align: right; }

    /* TIMELINE */
    .timeline { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .day-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .day-label { font-size: 0.65rem; color: rgba(255,255,255,0.3); }
    .day-dot { width: 28px; height: 28px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: center; font-size: 0.65rem; color: rgba(255,255,255,0.3); }
    .day-dot.active { background: rgba(167,139,250,0.25); border-color: rgba(167,139,250,0.5); color: #a78bfa; }
    .day-dot.today { background: rgba(255,107,53,0.25); border-color: #FF6B35; color: #FF6B35; }

    /* ALERT CARDS */
    .alert-card { display: flex; gap: 12px; align-items: flex-start; background: rgba(255,180,50,0.07); border: 1px solid rgba(255,180,50,0.2); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .alert-card i { font-size: 1.2rem; color: #FFB347; margin-top: 1px; }
    .alert-text { font-size: 0.85rem; }
    .alert-text strong { color: #FFB347; }
    .suggestion-card { display: flex; gap: 12px; align-items: flex-start; background: rgba(45,212,168,0.07); border: 1px solid rgba(45,212,168,0.2); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .suggestion-card i { font-size: 1.2rem; color: #2DD4A8; margin-top: 1px; }

    /* DIET PIE */
    .diet-visual { display: flex; align-items: center; gap: 24px; }
    .pie-wrap { position: relative; width: 100px; height: 100px; flex-shrink: 0; }
    .pie-wrap svg { transform: rotate(-90deg); }
    .pie-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; }
    .diet-legend { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    /* EMPTY / NO DATA */
    .no-data-state { text-align: center; padding: 60px 20px; }
    .no-data-state i { font-size: 3.5rem; color: rgba(167,139,250,0.25); display: block; margin-bottom: 16px; }
    .no-data-state h2 { font-size: 1.3rem; margin: 0 0 10px; }
    .no-data-state p { color: rgba(255,255,255,0.4); font-size: 0.88rem; }
    .btn-demo { display: inline-block; margin-top: 20px; padding: 10px 24px; background: linear-gradient(135deg, #a78bfa, #7c3aed); border: none; border-radius: 24px; color: #fff; font-size: 0.85rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: opacity 0.2s; }
    .btn-demo:hover { opacity: 0.85; }
    .btn-clear { background: rgba(255,60,60,0.1); border: 1px solid rgba(255,60,60,0.25); color: #ff6b6b; border-radius: 8px; padding: 7px 16px; font-size: 0.78rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: background 0.2s; }
    .btn-clear:hover { background: rgba(255,60,60,0.2); }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media(max-width: 640px) { .two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">🍽️ FeastFleet</a>
      <div class="nav-links">
        <a href="ai-agent.html">🤖 Food Agent</a>
        <a href="food-profile.html" style="color:#a78bfa;">🧠 My Profile</a>
        <a href="restaurants.html">Restaurants</a>
      </div>
      <div class="nav-auth"></div>
    </div>
  </nav>

  <div class="hero">
    <div class="badge">BEHAVIORAL AI</div>
    <h1>🧠 My Food Profile</h1>
    <p>Your AI-powered food memory — patterns, habits, and personalized insights</p>
  </div>

  <div class="main" id="main-content">
    <!-- Rendered by JS -->
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/foodMemory.js"></script>
  <script src="js/chatbot-widget.js"></script>
  <script>
    const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    function injectDemoData() {
      const dishes = [
        { name: 'Chicken Biryani', restaurant: 'Royal Biryani House', price: 180, category: 'rice', isVeg: false },
        { name: 'Al Faham Quarter', restaurant: 'AK Take Away', price: 230, category: 'al faham', isVeg: false },
        { name: 'Chicken Biryani', restaurant: 'Royal Biryani House', price: 180, category: 'rice', isVeg: false },
        { name: 'Kothu Parotta', restaurant: 'AK Take Away', price: 139, category: 'parotta', isVeg: false },
        { name: 'Dragon Chicken', restaurant: 'AK Take Away', price: 299, category: 'non-veg', isVeg: false },
        { name: 'Paneer Butter Masala', restaurant: 'Spice Garden', price: 249, category: 'curry', isVeg: true },
        { name: 'Chicken Biryani', restaurant: 'Royal Biryani House', price: 180, category: 'rice', isVeg: false },
        { name: 'Sharjah Shake', restaurant: 'AK Take Away', price: 90, category: 'shakes', isVeg: true },
        { name: 'Butter Chicken', restaurant: 'Spice Garden', price: 299, category: 'curries', isVeg: false },
        { name: 'Chocolate Shake', restaurant: 'AK Take Away', price: 125, category: 'shakes', isVeg: true },
        { name: 'Chilli Parotta', restaurant: 'AK Take Away', price: 139, category: 'parotta', isVeg: false },
        { name: 'Chicken Fried Rice', restaurant: 'AK Take Away', price: 169, category: 'rice', isVeg: false },
      ];
      const now = Date.now();
      const memory = dishes.map((d, i) => ({
        ...d,
        timestamp: new Date(now - i * 1.5 * 24 * 3600 * 1000).toISOString(),
        dayOfWeek: DAYS[new Date(now - i * 1.5 * 24 * 3600 * 1000).getDay()],
        hour: [19, 13, 20, 14, 12, 19, 13, 18, 20, 11, 13, 19][i],
      }));
      localStorage.setItem('feastfleet_food_memory', JSON.stringify(memory));
      renderProfile();
    }

    function clearData() {
      FoodMemory.clearMemory();
      localStorage.removeItem('feastfleet_memory_recorded_orders');
      renderProfile();
    }

    function renderProfile() {
      const main = document.getElementById('main-content');
      const memory = FoodMemory.getMemory();
      const insight = FoodMemory.generateInsight();

      if (!insight.hasData || memory.length === 0) {
        main.innerHTML = `
          <div class="no-data-state">
            <i class="bi bi-brain"></i>
            <h2>No Food History Yet</h2>
            <p>Place orders on FeastFleet and I'll automatically build<br>your personalized food profile over time.</p>
            <p style="margin-top:16px;font-size:0.8rem;color:rgba(167,139,250,0.6);">Want to see how it looks? Load demo data:</p>
            <button class="btn-demo" onclick="injectDemoData()">Load Demo Profile</button>
          </div>`;
        return;
      }

      const p = insight.patterns;
      const now = new Date();

      // Build activity timeline (last 7 days)
      const last7 = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(d.getDate() - i);
        const dayStr = DAYS[d.getDay()];
        const isToday = i === 0;
        const count = memory.filter(e => {
          const ed = new Date(e.timestamp);
          return ed.toDateString() === d.toDateString();
        }).length;
        last7.push({ label: dayStr, count, isToday });
      }

      // Cuisine frequency from categories
      const catCount = {};
      memory.forEach(e => { catCount[e.category] = (catCount[e.category] || 0) + 1; });
      const topCats = Object.entries(catCount).sort((a,b) => b[1]-a[1]).slice(0, 5);
      const maxCat = topCats[0]?.[1] || 1;

      // Veg vs non-veg
      const vegCt = memory.filter(e => e.isVeg).length;
      const nonVegCt = memory.length - vegCt;
      const vegPct = Math.round((vegCt / memory.length) * 100);
      const nonVegPct = 100 - vegPct;

      main.innerHTML = `
        <!-- TOP STATS -->
        <div class="stats-grid">
          <div class="stat-card highlight">
            <div class="stat-icon">🍽️</div>
            <div class="stat-val">${memory.length}</div>
            <div class="stat-label">Total Items Ordered</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">📅</div>
            <div class="stat-val">${p.last7DaysOrders}</div>
            <div class="stat-label">Orders This Week</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">💰</div>
            <div class="stat-val">₹${p.avgSpend}</div>
            <div class="stat-label">Avg Spend / Item</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">${p.peakMeal === 'lunch' ? '☀️' : p.peakMeal === 'dinner' ? '🌙' : '🕐'}</div>
            <div class="stat-val">${p.peakMeal.charAt(0).toUpperCase() + p.peakMeal.slice(1)}</div>
            <div class="stat-label">Peak Order Time</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🏠</div>
            <div class="stat-val" style="font-size:0.9rem;">${p.topRestaurant ? p.topRestaurant.name.split(' ')[0] : '—'}</div>
            <div class="stat-label">Favourite Restaurant</div>
          </div>
        </div>

        <!-- ALERTS & SUGGESTIONS -->
        ${p.repetitionAlerts.length > 0 ? `
        <div class="section" style="border-color:rgba(255,180,50,0.2);background:rgba(255,180,50,0.04);">
          <div class="section-title">⚠️ Repetition Alerts</div>
          ${p.repetitionAlerts.map(a => `
            <div class="alert-card">
              <i class="bi bi-exclamation-triangle-fill"></i>
              <div class="alert-text">You've ordered <strong>${a.dish}</strong> ${a.count} times this week. Want to try something different today?</div>
            </div>
          `).join('')}
          <div class="suggestion-card">
            <i class="bi bi-lightbulb-fill"></i>
            <div class="alert-text">Try the <a href="ai-agent.html" style="color:#2DD4A8;">🤖 Food Agent</a> — it will suggest dishes you haven't tried recently!</div>
          </div>
        </div>` : ''}

        <div class="two-col">

          <!-- FAVOURITE DISHES -->
          <div class="section">
            <div class="section-title">⭐ Top Dishes</div>
            ${p.topDishes.length ? p.topDishes.map((d, i) => `
              <div class="dish-row">
                <div class="dish-rank">${['🥇','🥈','🥉','4️⃣','5️⃣'][i]}</div>
                <div class="dish-name">${d[0]}</div>
                <div class="dish-count">${d[1]}x</div>
              </div>`).join('') : '<p style="color:rgba(255,255,255,0.3);font-size:0.85rem;">No data yet</p>'}
          </div>

          <!-- VEG VS NON-VEG -->
          <div class="section">
            <div class="section-title">🥗 Diet Balance</div>
            <div class="diet-visual">
              <div class="pie-wrap">
                <svg width="100" height="100" viewBox="0 0 36 36">
                  <circle cx="18" cy="18" r="15.9" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3.8"/>
                  <circle cx="18" cy="18" r="15.9" fill="none" stroke="#2DD4A8" stroke-width="3.8"
                    stroke-dasharray="${vegPct} ${nonVegPct}" stroke-dashoffset="0"/>
                  <circle cx="18" cy="18" r="15.9" fill="none" stroke="#FF6B35" stroke-width="3.8"
                    stroke-dasharray="${nonVegPct} ${vegPct}" stroke-dashoffset="${-vegPct}"/>
                </svg>
                <div class="pie-label">${p.dietTendency === 'vegetarian' ? '🥦' : '🍗'}</div>
              </div>
              <div class="diet-legend">
                <div class="legend-item">
                  <div class="legend-dot" style="background:#2DD4A8;"></div>
                  <div>Vegetarian — ${vegPct}%</div>
                </div>
                <div class="legend-item">
                  <div class="legend-dot" style="background:#FF6B35;"></div>
                  <div>Non-Veg — ${nonVegPct}%</div>
                </div>
                <div style="font-size:0.75rem;color:rgba(255,255,255,0.3);margin-top:8px;">
                  You prefer <strong style="color:#f0f0f5;">${p.dietTendency}</strong> food
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- CATEGORY FREQUENCY -->
        <div class="section">
          <div class="section-title">📊 Food Category Habits</div>
          <div class="bar-chart">
            ${topCats.map(([cat, count]) => `
              <div class="bar-row">
                <div class="bar-label">${cat.charAt(0).toUpperCase() + cat.slice(1)}</div>
                <div class="bar-track"><div class="bar-fill" style="width:${Math.round((count/maxCat)*100)}%"></div></div>
                <div class="bar-val">${count}x</div>
              </div>`).join('')}
          </div>
        </div>

        <!-- ACTIVITY TIMELINE -->
        <div class="section">
          <div class="section-title">📅 Activity This Week</div>
          <div class="timeline">
            ${last7.map(d => `
              <div class="day-col">
                <div class="day-dot ${d.isToday ? 'today' : d.count > 0 ? 'active' : ''}">
                  ${d.count > 0 ? d.count : ''}
                </div>
                <div class="day-label">${d.label}</div>
              </div>`).join('')}
          </div>
          <div style="font-size:0.72rem;color:rgba(255,255,255,0.25);margin-top:12px;display:flex;gap:16px;">
            <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:rgba(167,139,250,0.25);border:1px solid rgba(167,139,250,0.5);border-radius:3px;"></span>Active day</span>
            <span style="display:flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;background:rgba(255,107,53,0.25);border:1px solid #FF6B35;border-radius:3px;"></span>Today</span>
          </div>
        </div>

        <!-- ACTIONS -->
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;">
          <a href="ai-agent.html" style="padding:10px 24px;background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;border-radius:24px;text-decoration:none;font-size:0.85rem;font-weight:700;">🤖 Get AI Recommendations</a>
          <a href="restaurants.html" style="padding:10px 24px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#f0f0f5;border-radius:24px;text-decoration:none;font-size:0.85rem;font-weight:600;">🍽️ Browse Restaurants</a>
          <button class="btn-clear" onclick="clearData()">🗑 Clear Memory</button>
        </div>
      `;
    }

    // Render on load
    renderProfile();
  </script>
</body>
</html>
